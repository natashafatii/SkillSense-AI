<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="skillsense_ai">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>skillsense_ai</title>
  <link rel="manifest" href="manifest.json">

  <!-- Required by clerk_flutter package on web (passkeys support) -->
  <script src="https://github.com/corbado/flutter-passkeys/releases/download/2.4.0/bundle.js"></script>

  <!-- Clerk JS SDK bootstrap. The publishable key attribute makes the browser
       bundle create the supported global Clerk singleton. Flutter waits for
       __clerkReady before using it. -->
  <script>
    window.__clerkReady = false;
    window.__clerkError = null;

    async function initSkillSenseClerk() {
      try {
        if (!window.Clerk || typeof window.Clerk.load !== 'function') {
          throw new Error('Clerk browser bundle loaded without a Clerk instance.');
        }

        await window.Clerk.load();
        window.__clerkReady = true;
        console.info('[SkillSense] Clerk initialized successfully.');
      } catch (error) {
        window.__clerkError = error instanceof Error
          ? error.message
          : String(error);
        console.error('[SkillSense] Clerk initialization failed:', error);
      }
    }

    function failSkillSenseClerk() {
      window.__clerkError = 'Unable to download the Clerk JavaScript SDK.';
      console.error('[SkillSense] Clerk browser bundle failed to download.');
    }
  </script>
  <script
    defer
    crossorigin="anonymous"
    data-clerk-publishable-key="pk_test_c3R1bm5pbmctc2x1Zy0xMy5jbGVyay5hY2NvdW50cy5kZXYk"
    src="https://stunning-slug-13.clerk.accounts.dev/npm/@clerk/clerk-js@6/dist/clerk.browser.js"
    onload="initSkillSenseClerk()"
    onerror="failSkillSenseClerk()"
    type="text/javascript">
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
