<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <script src="startup_url.js"></script>
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="skillsense_ai">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>skillsense_ai</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Hide browser scrollbars without disabling scrolling. */
    * {
      scrollbar-width: none;
    }
    *::-webkit-scrollbar {
      display: none;
    }
  </style>

  <!-- Required by clerk_flutter package on web (passkeys support) -->
  <script src="https://github.com/corbado/flutter-passkeys/releases/download/2.4.0/bundle.js"></script>

  <script>
    window.loadSkillSenseClerk = async function (publishableKey) {
      const match = /^pk_(test|live)_([A-Za-z0-9+/]+={0,2})$/.exec(publishableKey);
      if (!match) throw new Error('Invalid Clerk publishable key.');

      const frontendApi = atob(match[2]);
      if (!/^(?:[a-z0-9](?:[a-z0-9-]*[a-z0-9])?\.)+[a-z0-9]+\$$/i.test(frontendApi)) {
        throw new Error('Invalid Clerk Frontend API domain.');
      }

      const script = document.createElement('script');
      script.crossOrigin = 'anonymous';
      script.dataset.clerkPublishableKey = publishableKey;
      script.src = 'https://' + frontendApi.slice(0, -1) +
        '/npm/@clerk/clerk-js@6/dist/clerk.browser.js';

      await new Promise((resolve, reject) => {
        script.onload = resolve;
        script.onerror = () => reject(new Error('Unable to download the Clerk JavaScript SDK.'));
        document.head.appendChild(script);
      });
      if (typeof window.Clerk?.load !== 'function') {
        throw new Error('Clerk browser bundle loaded without a Clerk instance.');
      }
      await window.Clerk.load();
      return window.Clerk;
    };
  </script>
</head>
<body>
  <!-- Locally bundled, pinned audio-only client. It joins backend-issued calls. -->
  <script type="module" src="vendor/skillsense_retell.mjs"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
